# HTML náhled práce přes Antora (GitHub Pages).
# PDF/DOCX se generují z pdf/dp.adoc, viz pdf/build.ps1.
site:
  title: Diplomová práce
  url: https://silatereza.github.io/dp
  start_page: diplomova-prace::index.adoc
  robots: disallow
content:
  sources:
    - url: .
      start_path: .
      branches: HEAD
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: build/site